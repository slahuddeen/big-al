<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jehol Model Lab</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/src/jehol/lab.css" />
</head>
<body>
    <div class="lab" id="lab">
        <aside class="index" id="index" aria-label="Animals">
            <header class="brand">
                <span class="seal" aria-hidden="true">热河</span>
                <div>
                    <h1>Jehol Model Lab</h1>
                    <p>Liaoning, 125 million years ago</p>
                </div>
            </header>
            <nav id="list" class="list"></nav>
        </aside>
        <main class="stage" id="stage">
            <div class="view" id="view"></div>
            <div class="loading" id="loading" hidden><span class="brush"></span>Sculpting</div>
            <div class="controls" role="toolbar" aria-label="View">
                <div class="seg" role="group" aria-label="Style">
                    <button type="button" id="mode-painted" aria-pressed="true">Painted</button>
                    <button type="button" id="mode-plain" aria-pressed="false">Plain</button>
                </div>
                <button type="button" class="tog" id="tog-fur" aria-pressed="true">Fur and feathers</button>
                <button type="button" class="tog" id="tog-turn" aria-pressed="false">Turntable</button>
            </div>
            <section class="card" id="card" aria-live="polite">
                <div class="card-head">
                    <h2 id="sp-name">Yutyrannus</h2>
                    <span class="len" id="sp-len"></span>
                </div>
                <p class="group" id="sp-group"></p>
                <div class="stages" id="stages" role="group" aria-label="Growth stage"></div>
                <p class="note" id="sp-note"></p>
                <p class="colour" id="sp-colour"></p>
            </section>
            <p class="hint">Drag to turn, scroll or pinch to zoom</p>
        </main>
    </div>
    <script type="module" src="/src/jehol/lab.js"></script>
</body>
</html>
